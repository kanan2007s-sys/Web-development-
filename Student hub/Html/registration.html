<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="../CSS/registration.css">
</head>

<body>

<div class="box">

<h1>Student Registration</h1>
<hr>

<form id="registrationForm">

    <label for="name">Name:</label>
    <input type="text" id="name" placeholder="Enter your full name">
    <span id="nameError"></span>

    <label for="enrollment">Enrollment ID</label>
    <input type="text" id="enrollment"placeholder="Enter you enrollment id">
    <span id="idError"></span>

    <label for="email">Email:</label>
    <input type="email" id="email" placeholder="Enter your email">
    <span id="emailError"></span>

    <label for="mobile">Mobile Number:</label>
    <input type="tel" id="mobile" placeholder="Enter 10 digit mobile number">
    <span id="mobileError"></span>

    <label for="password">Password:</label>
    <input type="password" id="password" placeholder="Enter password">
    <span id="passwordError"></span>
    <p id="strength"></p>

    <label for="confirmPassword">Confirm Password:</label>
    <input type="password" id="confirmPassword" placeholder="Re-enter password">
    <span id="confirmPasswordError"></span>

    <label for="course">Course:</label>
    <select id="course">
        <option value="">Select Course</option>
        <option value="CE">Computer Engineering</option>
        <option value="CSE">Computer Science and Engineering</option>
        <option value="IT">Information Technology</option>
        <option value="ME">Mechanical Engineering</option>
    </select>
    <span id="courseError"></span>

    <label for="year">Year:</label>
    <select id="year">
        <option value="">Select Year</option>
        <option value="1">1st Year</option>
        <option value="2">2nd Year</option>
        <option value="3">3rd Year</option>
        <option value="4">4th Year</option>
    </select>
    <span id="yearError"></span>

    <label>Gender:</label>

    <div class="gender">
        <input type="radio" name="gender" value="Male" id="male">
        <label for="male">Male</label>

        <input type="radio" name="gender" value="Female" id="female">
        <label for="female">Female</label>

        <input type="radio" name="gender" value="Other" id="other">
        <label for="other">Other</label>
    </div>

    <span id="genderError"></span>

    <div class="terms">
        <input type="checkbox" id="terms">
        <label for="terms">I agree to the terms and conditions</label>
    </div>

    <span id="termsError"></span>

    <div class="buttons">
        <button type="submit">Register</button>
        <button type="reset">Clear</button>
    </div>
    <p id="registrationStatus" role="status" aria-live="polite"></p>

</form>

<div class="footer">
    <a href="homepage.html">Home</a>
    &nbsp;&nbsp;&nbsp;
    <a href="FAQ.html">FAQ</a>
    &nbsp;&nbsp;&nbsp;
    <a href="Feedback.html">Feedback</a>
    &nbsp;&nbsp;&nbsp;
    <a href="about.html">About</a>
</div>

</div>

<script src="../Javascript/theme-switcher.js"></script>

<script src="../Javascript/hamburger-menu.js"></script>

<script src="../Javascript/registration-validation.js"></script>

</body>
</html>
