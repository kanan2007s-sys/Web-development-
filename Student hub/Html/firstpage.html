
<html>
<head>
    <title>Login page</title>
    <link rel="stylesheet" href="../CSS/login.css">
</head>
<body>
    <fieldset style="width:200px; margin:auto;">
        <h1 align="center">
            <fieldset style="margin:auto">Login</fieldset>
        </h1>

        <form id="loginForm">
            <h4 align="center">
                <input type="text" id="LoginId" placeholder="Login ID">
            </h4>

            <h4 align="center">
                <input type="password" id="password" placeholder="Password">
            </h4>

            <h2 align="center">
                <button type="submit">Submit</button>
            </h2>
        </form>
    </fieldset>

    <script src="../Javascript/theme-switcher.js"></script>
    <script src="../Javascript/hamburger-menu.js"></script>
    <script src="../Javascript/login.js"></script>
</body>
</html>
