<!DOCTYPE html>
<html>
<head>
    <title>Fee Payment Gateway</title>
    <link rel="stylesheet" href="../CSS/fee.css">
</head>

<body>

<h1>Fee Payment Gateway</h1>
<hr>

<form>

    <label>Student Name:</label><br>
    <input type="text" placeholder="Enter your name">
    <br><br>

    <label>Student ID:</label><br>
    <input type="text" placeholder="Enter ID">
    <br><br>

    <label>Email:</label><br>
    <input type="email" placeholder="Enter email">
    <br><br>

    <label>Course:</label><br>
    <select>
        <option>Computer Engineering</option>
        <option>Mechanical Engineering</option>
        <option>Civil Engineering</option>
        <option>Electrical Engineering</option>
    </select>

    <br><br>

    <label>Fee Amount:</label><br>
    <input type="number" placeholder="Enter amount">
    <br><br>

    <label>Payment Method:</label><br>

    <input type="radio" name="payment"> UPI
    <input type="radio" name="payment"> Credit Card
    <input type="radio" name="payment"> Debit Card
    <input type="radio" name="payment"> Net Banking

    <br><br>

    <label>Card/UPI Details:</label><br>
    <input type="text" placeholder="Enter payment details">
    <br><br>

    <input type="checkbox"> I agree to the payment terms

    <br><br>

    <button type="submit">Pay Now</button>
    <button type="reset">Clear</button>

</form>
<script src="../Javascript/theme-switcher.js"></script>
<script src="../Javascript/hamburger-menu.js"></script>

</body>
</html>
